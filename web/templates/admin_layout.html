{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка — The Runish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        :root {
            --red-50:   #fef2f2;
            --red-100:  #fee2e2;
            --red-200:  #fecaca;
            --red-300:  #fca5a5;
            --red-400:  #f87171;
            --red-500:  #ef4444;
            --red-600:  #dc2626;
            --red-700:  #b91c1c;
            --red-800:  #991b1b;
            --cream:    #fdf6e3;
            --cream-2:  #faf3e0;
            --surface:  #ffffff;
            --border:   #f0e8df;
            --ink:      #44403c;
            --muted:    #78716c;
            --radius:   10px;
            --shadow:   0 1px 6px rgba(180,83,9,0.09);
            --shadow-md:0 4px 16px rgba(180,83,9,0.12);
            --sidebar-w:224px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--cream);
            color: var(--ink);
            line-height: 1.55;
            display: flex;
            min-height: 100vh;
        }

        /* ─── Sidebar ─── */
        .admin-sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }
        .sb-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 20px 18px;
            border-bottom: 1px solid var(--border);
            text-decoration: none;
        }
        .sb-brand-text {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--ink);
            letter-spacing: -0.02em;
        }
        .sb-brand-text span {
            display: block;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0;
        }
        .sb-nav {
            flex: 1;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .sb-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--ink);
            transition: background .12s, color .12s;
        }
        .sb-nav a:hover { background: var(--cream-2); color: var(--red-700); }
        .sb-nav a.active { background: var(--red-50); color: var(--red-700); }
        .sb-nav-icon {
            width: 18px;
            height: 18px;
            opacity: 0.6;
            flex-shrink: 0;
        }
        .sb-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 10px;
        }
        .sb-footer {
            padding: 12px 10px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sb-footer a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--muted);
            transition: background .12s, color .12s;
        }
        .sb-footer a:hover { background: var(--cream-2); color: var(--ink); }
        .sb-logout {
            background: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--red-700);
            width: 100%;
            text-align: left;
            transition: background .12s;
        }
        .sb-logout:hover { background: var(--red-50); }

        /* ─── Main content ─── */
        .admin-main {
            flex: 1;
            padding: 2rem 2.5rem;
            min-width: 0;
            max-width: 1040px;
        }

        /* ─── Page header ─── */
        .page-hdr {
            margin-bottom: 1.75rem;
        }
        .page-hdr h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.03em;
            margin-bottom: 0.25rem;
        }
        .page-hdr p {
            font-size: 0.88rem;
            color: var(--muted);
        }

        /* ─── Tables ─── */
        .table-wrap {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.875rem;
        }
        th {
            background: var(--cream);
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border);
        }
        tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #fdfaf6; }

        /* ─── Buttons ─── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 0.5rem 1.1rem;
            background: var(--red-600);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            transition: background .12s, transform .05s;
        }
        .btn:hover { background: var(--red-700); }
        .btn:active { transform: translateY(1px); }
        .btn-secondary {
            background: var(--surface);
            color: var(--red-700);
            border: 1px solid var(--red-200);
        }
        .btn-secondary:hover { background: var(--red-50); }
        .btn-danger {
            background: var(--red-50);
            color: var(--red-700);
            border: 1px solid var(--red-200);
        }
        .btn-danger:hover { background: var(--red-100); }
        .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; border-radius: 6px; }

        /* ─── Forms ─── */
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--ink);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.55rem 0.8rem;
            border: 1px solid var(--red-200);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            background: var(--surface);
            color: var(--ink);
            transition: border-color .15s, box-shadow .15s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--red-400);
            box-shadow: 0 0 0 3px var(--red-100);
        }
        .form-group textarea { min-height: 100px; resize: vertical; }

        /* ─── Alerts ─── */
        .alert-error {
            background: var(--red-100);
            color: var(--red-800);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            border: 1px solid var(--red-200);
        }

        /* ─── Status badges ─── */
        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.65rem;
            border-radius: 20px;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }
        .status-confirmed { background: #dcfce7; color: #166534; }
        .status-pending   { background: #fef3c7; color: #92400e; }
        .status-rejected  { background: var(--red-100); color: var(--red-800); }
        .status-new       { background: var(--red-50); color: var(--red-700); }
        .status-refunded  { background: #f3e8ff; color: #6b21a8; }
        .status-active    { background: #dcfce7; color: #166534; }
        .status-expired   { background: #f5f5f4; color: var(--muted); }
        .status-cancelled { background: var(--red-100); color: var(--red-800); }

        /* ─── Card ─── */
        .card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.25rem 1.5rem;
        }

        /* ─── Misc ─── */
        h2, h3 { color: var(--ink); }
        a { color: var(--red-700); }
        .text-muted { color: var(--muted); font-size: 0.85rem; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ════════════ Redesign overlay — premium warm admin ════════════ */
        :root {
            --ink:        #2a2521;
            --muted:      #8c8278;
            --border:     rgba(122, 84, 30, 0.13);
            --border-2:   rgba(122, 84, 30, 0.08);
            --surface:    #fffdfa;
            --radius:     16px;
            --radius-sm:  11px;
            --shadow:     0 1px 2px rgba(90, 55, 15, 0.05), 0 6px 20px -8px rgba(120, 75, 25, 0.16);
            --shadow-md:  0 12px 34px -10px rgba(120, 70, 20, 0.26);
            --shadow-lg:  0 24px 60px -18px rgba(120, 70, 20, 0.32);
            --accent:     linear-gradient(135deg, #f24a37 0%, #dc2626 100%);
            --accent-soft:linear-gradient(135deg, rgba(242,74,55,0.12), rgba(220,38,38,0.10));
            --sidebar-w:  250px;
            --ease:       cubic-bezier(0.22, 1, 0.36, 1);
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background:
                radial-gradient(1100px 600px at 100% -8%, rgba(242,74,55,0.07), transparent 60%),
                radial-gradient(900px 500px at -10% 0%, rgba(232,162,60,0.10), transparent 55%),
                linear-gradient(180deg, #fbf4e6 0%, #f7efe0 100%);
            background-attachment: fixed;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection { background: rgba(242,74,55,0.18); }
        * { scrollbar-width: thin; scrollbar-color: rgba(122,84,30,0.28) transparent; }
        *::-webkit-scrollbar { width: 10px; height: 10px; }
        *::-webkit-scrollbar-thumb { background: rgba(122,84,30,0.22); border-radius: 99px; border: 3px solid transparent; background-clip: padding-box; }
        *::-webkit-scrollbar-thumb:hover { background: rgba(122,84,30,0.40); background-clip: padding-box; }

        /* ─── Sidebar ─── */
        .admin-sidebar {
            width: var(--sidebar-w);
            background: rgba(255, 253, 250, 0.78);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-right: 1px solid var(--border);
            box-shadow: 1px 0 0 rgba(255,255,255,0.5) inset, var(--shadow);
            padding: 6px;
        }
        .sb-brand {
            gap: 12px;
            padding: 16px 14px 16px;
            border-bottom: 1px solid var(--border-2);
            margin-bottom: 6px;
        }
        .sb-brand img { width: 38px; height: 38px; border-radius: 11px; padding: 5px; background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--border-2); }
        .sb-brand-text { font-family: 'Manrope', 'Inter', sans-serif; font-weight: 800; font-size: 1.02rem; letter-spacing: -0.02em; }
        .sb-brand-text span { font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }

        .sb-nav { padding: 8px 6px; gap: 3px; }
        .sb-nav a {
            position: relative;
            gap: 12px;
            padding: 10px 13px;
            border-radius: 11px;
            font-weight: 600;
            color: #6d645b;
            letter-spacing: -0.01em;
            transition: background .18s var(--ease), color .18s var(--ease), transform .12s var(--ease);
        }
        .sb-nav a:hover { background: rgba(122,84,30,0.06); color: var(--ink); transform: translateX(2px); }
        .sb-nav a.active {
            background: var(--accent-soft);
            color: #b91c1c;
        }
        .sb-nav a.active::before {
            content: '';
            position: absolute;
            left: -6px; top: 50%;
            width: 4px; height: 20px;
            transform: translateY(-50%);
            border-radius: 0 4px 4px 0;
            background: var(--accent);
        }
        .sb-nav a.active .sb-nav-icon { opacity: 1; color: #dc2626; }
        .sb-nav-icon { width: 19px; height: 19px; opacity: 0.55; transition: opacity .18s; }
        .sb-nav a:hover .sb-nav-icon { opacity: 0.9; }
        .sb-divider { background: var(--border-2); margin: 10px 12px; }
        .sb-footer { border-top: 1px solid var(--border-2); padding: 8px 6px; }
        .sb-footer a, .sb-logout { border-radius: 11px; font-weight: 600; padding: 10px 13px; }
        .sb-footer a:hover { background: rgba(122,84,30,0.06); }
        .sb-logout { color: #c2410c; }
        .sb-logout:hover { background: rgba(242,74,55,0.10); }

        /* ─── Main ─── */
        .admin-main {
            padding: 2.4rem 3rem;
            max-width: 1140px;
            animation: adminIn .45s var(--ease) both;
        }
        @keyframes adminIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* ─── Page header ─── */
        .page-hdr { margin-bottom: 2rem; }
        .page-hdr h2 {
            font-family: 'Manrope', 'Inter', sans-serif;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: -0.035em;
            line-height: 1.05;
        }
        .page-hdr p { font-size: 0.92rem; color: var(--muted); margin-top: 0.4rem; }
        h2, h3 { font-family: 'Manrope', 'Inter', sans-serif; letter-spacing: -0.02em; }

        /* ─── Surfaces: tables & cards ─── */
        .table-wrap, .card, .day-table-wrap, .kpi-card, .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .table-wrap, .day-table-wrap { overflow: hidden; }
        .card { padding: 1.5rem 1.65rem; }
        .table-wrap:hover, .day-table-wrap:hover { box-shadow: var(--shadow-md); }
        .table-wrap, .day-table-wrap { transition: box-shadow .25s var(--ease); }

        table { border-collapse: separate; border-spacing: 0; }
        th, td { padding: 0.95rem 1.15rem; border-bottom: 1px solid var(--border-2); }
        th {
            background: linear-gradient(180deg, rgba(247,239,224,0.9), rgba(247,239,224,0.6));
            color: #9a8f82;
            font-weight: 700;
            font-size: 0.68rem;
            letter-spacing: 0.09em;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1;
        }
        td { font-size: 0.9rem; }
        tbody tr { transition: background .15s var(--ease); }
        tbody tr:hover { background: rgba(242,74,55,0.045); }
        tbody tr:last-child td { border-bottom: none; }
        td code, .page-hdr code, code {
            font-family: 'SF Mono', ui-monospace, Menlo, monospace;
            font-size: 0.82em;
            background: rgba(122,84,30,0.08);
            color: #9a3412;
            padding: 2px 7px;
            border-radius: 6px;
            border: 1px solid var(--border-2);
        }

        /* ─── Buttons ─── */
        .btn {
            gap: 7px;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: #fff;
            border-radius: 11px;
            font-weight: 600;
            letter-spacing: -0.01em;
            box-shadow: 0 1px 2px rgba(220,38,38,0.25), 0 8px 18px -8px rgba(220,38,38,0.55);
            transition: transform .14s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
        }
        .btn:hover { filter: brightness(1.05); box-shadow: 0 2px 4px rgba(220,38,38,0.3), 0 14px 26px -8px rgba(220,38,38,0.6); transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-secondary {
            background: var(--surface);
            color: #b4341c;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .btn-secondary:hover { background: #fff; border-color: rgba(242,74,55,0.4); filter: none; }
        .btn-danger {
            background: rgba(242,74,55,0.08);
            color: #c2410c;
            border: 1px solid rgba(242,74,55,0.22);
            box-shadow: none;
        }
        .btn-danger:hover { background: rgba(242,74,55,0.15); filter: none; box-shadow: none; }
        .btn-sm { padding: 0.36rem 0.78rem; font-size: 0.8rem; border-radius: 9px; }
        .btn:focus-visible, .btn-submit:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(242,74,55,0.3); }

        /* ─── Forms ─── */
        .form-group label { font-size: 0.82rem; font-weight: 600; color: #6d645b; letter-spacing: 0.01em; margin-bottom: 0.45rem; }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.65rem 0.9rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fff;
            font-size: 0.92rem;
            box-shadow: inset 0 1px 2px rgba(90,55,15,0.04);
            transition: border-color .18s var(--ease), box-shadow .18s var(--ease);
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: rgba(242,74,55,0.6);
            box-shadow: 0 0 0 4px rgba(242,74,55,0.13);
        }
        .form-group textarea { min-height: 110px; }

        /* ─── Alerts ─── */
        .alert-error {
            background: linear-gradient(180deg, rgba(242,74,55,0.10), rgba(220,38,38,0.06));
            color: #991b1b;
            border: 1px solid rgba(242,74,55,0.25);
            border-radius: var(--radius-sm);
            padding: 0.85rem 1.05rem;
            font-weight: 500;
        }

        /* ─── Status badges & chips ─── */
        .status-badge {
            padding: 0.28rem 0.7rem;
            border-radius: 99px;
            font-size: 0.73rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
        }
        .user-chip {
            background: var(--accent-soft);
            color: #b4341c;
            border: 1px solid rgba(242,74,55,0.16);
            border-radius: 99px;
            font-weight: 600;
            padding: 3px 11px;
        }

        /* ─── Dashboard polish ─── */
        .kpi-card { padding: 1.4rem 1.5rem; transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
        .kpi-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .kpi-label { color: #9a8f82; letter-spacing: 0.07em; }
        .kpi-value { font-family: 'Manrope','Inter',sans-serif; font-size: 1.9rem; font-weight: 800; letter-spacing: -0.04em; }
        .kpi-value.red { background: var(--accent); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .bar { background: linear-gradient(180deg, #f87171, #dc2626) !important; border-radius: 7px 7px 0 0 !important; }
        .bar:hover { filter: brightness(1.08); }
        .section-title { font-family: 'Manrope','Inter',sans-serif; font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }

        @media (max-width: 860px) {
            .admin-main { padding: 1.5rem 1.2rem; }
            .page-hdr h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

                </svg>
                Открыть сайт
            </a>
            <form method="POST" action="/admin/logout">
                <button type="submit" class="sb-logout">
                    <svg class="sb-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                    Выйти
                </button>
            </form>
        </div>
    </aside>
    <main class="admin-main">
        {{template "content" .}}
    </main>
    <script>
        (function () {
            var path = window.location.pathname;
            var links = document.querySelectorAll('.sb-nav a');
            var best = null, bestLen = -1;
            links.forEach(function (a) {
                var href = a.getAttribute('href');
                if (!href || href === '/admin') {
                    if (path === '/admin' && href === '/admin' && bestLen < 0) { best = a; bestLen = 6; }
                    return;
                }
                if (path === href || path.indexOf(href + '/') === 0) {
                    if (href.length > bestLen) { best = a; bestLen = href.length; }
                }
            });
            if (best) best.classList.add('active');
        })();
    </script>
</body>
</html>
{{end}}
