{{define "content"}}
<h2 style="font-size:1.4rem;margin-bottom:1.5rem">Новая неделя</h2>

{{if .Error}}
<div class="alert-error">{{.Error}}</div>
{{end}}

<form method="POST" action="{{.Base}}/plans" style="max-width:520px">
    <div class="form-group">
        <label>Неделя *</label>
        <input type="date" name="week_start" required value="{{.WeekStart}}">
        <small style="color:#9ca3af">Любая дата внутри недели — план всё равно начнётся с понедельника.</small>
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="copy_previous" checked style="width:auto;margin-right:0.5rem">
            Скопировать прошлую неделю (группы и задания)
        </label>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
        <button type="submit" class="btn">Создать</button>
        <a href="{{.Base}}/plans" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{{end}}
