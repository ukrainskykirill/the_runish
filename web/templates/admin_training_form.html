{{define "content"}}
<h2 style="font-size:1.4rem;margin-bottom:1.5rem">
    {{if .Training}}Редактировать тренировку{{else}}Новая тренировка{{end}}
</h2>

{{if .Error}}
<div class="alert-error">{{.Error}}</div>
{{end}}

<form method="POST" action="{{if .Training}}/admin/trainings/{{.Training.ID}}{{else}}/admin/trainings{{end}}" style="max-width:600px">
    <div class="form-group">
        <label>Название *</label>
        <input type="text" name="title" required value="{{if .Training}}{{.Training.Title}}{{end}}" placeholder="Например: Интервальная тренировка">
    </div>

    <div class="form-group">
        <label>Описание</label>
        <textarea name="description" rows="4" placeholder="Раскрывается по клику в расписании (необязательно)">{{if .Training}}{{.Training.Description}}{{end}}</textarea>
    </div>

    <div class="form-group">
        <label>Тип *</label>
        <select name="kind" required>
            {{$k := "regular"}}{{if .Training}}{{$k = .Training.Kind}}{{end}}
            <option value="regular" {{if eq $k "regular"}}selected{{end}}>Регулярная тренировка</option>
            <option value="sunday_runish" {{if eq $k "sunday_runish"}}selected{{end}}>Sunday Runish</option>
        </select>
        <small style="color:#6b7280;margin-top:0.2rem;display:block">Sunday Runish — открыта для всех авторизованных без подписки.</small>
    </div>

    <div class="form-group">
        <label>Дата *</label>
        <input type="date" name="training_date" required value="{{if .Training}}{{.Training.TrainingDate}}{{end}}">
    </div>

    <div class="form-group">
        <label>Время *</label>
        <input type="time" name="start_time" required value="{{if .Training}}{{.Training.StartTime}}{{end}}">
    </div>

    <div class="form-group">
        <label>Место *</label>
        <input type="text" name="place" required value="{{if .Training}}{{.Training.Place}}{{end}}" placeholder="Например: Стадион «Локомотив»">
    </div>

    <div class="form-group">
        <label>Ссылка на место</label>
        <input type="url" name="place_url" value="{{if and .Training .Training.PlaceURL}}{{.Training.PlaceURL}}{{end}}" placeholder="https://yandex.ru/maps/... (необязательно)">
    </div>

    <div class="form-group">
        <label>Лимит мест</label>
        <input type="number" name="capacity" min="1" value="{{if and .Training .Training.Capacity}}{{.Training.Capacity}}{{end}}" placeholder="напр. 20">
        <small style="color:#6b7280;margin-top:0.2rem;display:block">Максимум участников на одно занятие. Пусто = без лимита.</small>
    </div>

    <div class="form-group">
        <label>Порядок сортировки</label>
        <input type="number" name="sort_order" value="{{if .Training}}{{.Training.SortOrder}}{{else}}0{{end}}">
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" name="is_active" {{if or (not .Training) .Training.IsActive}}checked{{end}} style="width:auto;margin-right:0.5rem">
            Активна (видна на сайте)
        </label>
    </div>

    <div style="display:flex;gap:0.75rem;margin-top:1.5rem">
        <button type="submit" class="btn">{{if .Training}}Сохранить{{else}}Создать{{end}}</button>
        <a href="/admin/trainings" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{{end}}
