{{define "layout"}}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "login_title" .}} — The Runish</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: #2a2521;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(900px 520px at 90% -10%, rgba(242,74,55,0.16), transparent 60%),
                radial-gradient(800px 480px at -5% 110%, rgba(232,162,60,0.18), transparent 55%),
                linear-gradient(180deg, #fbf4e6 0%, #f5ebd8 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .login-wrap {
            width: 100%;
            max-width: 410px;
            animation: in .5s cubic-bezier(0.22,1,0.36,1) both;
        }
        @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
        .login-brand {
            display: flex;
            align-items: center;
            gap: 14px;
            justify-content: center;
            margin-bottom: 1.75rem;
        }
        .login-monogram {
            width: 52px; height: 52px;
            border-radius: 15px;
            display: grid; place-items: center;
            font-family: 'Manrope', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: #fff;
            background: linear-gradient(135deg, #f24a37, #dc2626);
            box-shadow: 0 10px 26px -8px rgba(220,38,38,0.65), inset 0 1px 0 rgba(255,255,255,0.3);
        }
        .login-brand-text {
            font-family: 'Manrope', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #2a2521;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }
        .login-brand-text span {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #8c8278;
            letter-spacing: 0;
        }
        .login-card {
            background: rgba(255, 253, 250, 0.85);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(122, 84, 30, 0.13);
            border-radius: 22px;
            padding: 2.1rem 2.1rem 2.2rem;
            box-shadow: 0 24px 60px -18px rgba(120, 70, 20, 0.36), 0 1px 0 rgba(255,255,255,0.6) inset;
        }
        .login-card h2 {
            font-family: 'Manrope', sans-serif;
            font-size: 1.3rem;
            font-weight: 800;
            color: #2a2521;
            letter-spacing: -0.03em;
            margin-bottom: 0.35rem;
        }
        .login-card p {
            font-size: 0.88rem;
            color: #8c8278;
            margin-bottom: 1.85rem;
        }
        .form-group { margin-bottom: 1.05rem; }
        .form-group label {
            display: block;
            margin-bottom: 0.45rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: #6d645b;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 0.95rem;
            border: 1px solid rgba(122, 84, 30, 0.16);
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            color: #2a2521;
            background: #fff;
            box-shadow: inset 0 1px 2px rgba(90,55,15,0.05);
            transition: border-color .18s, box-shadow .18s;
        }
        .form-group input:focus {
            outline: none;
            border-color: rgba(242,74,55,0.6);
            box-shadow: 0 0 0 4px rgba(242,74,55,0.14);
        }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, #f24a37, #dc2626);
            color: #fff;
            border: none;
            border-radius: 13px;
            cursor: pointer;
            font-family: 'Manrope', inherit;
            font-size: 0.98rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-top: 1.6rem;
            box-shadow: 0 12px 26px -8px rgba(220,38,38,0.6);
            transition: transform .14s, box-shadow .2s, filter .2s;
        }
        .btn-submit:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: 0 16px 32px -8px rgba(220,38,38,0.65); }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(242,74,55,0.35); }
        .error {
            background: linear-gradient(180deg, rgba(242,74,55,0.12), rgba(220,38,38,0.07));
            color: #991b1b;
            padding: 0.75rem 0.95rem;
            border-radius: 12px;
            font-size: 0.86rem;
            font-weight: 500;
            margin-bottom: 1.3rem;
            border: 1px solid rgba(242,74,55,0.25);
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="login-brand">
            <div class="login-monogram">R</div>
            <div class="login-brand-text">
                The Runish
                <span>{{template "login_brand_sub" .}}</span>
            </div>
        </div>
        <div class="login-card">
            <h2>{{template "login_title" .}}</h2>
            <p>{{template "login_hint" .}}</p>
            {{if .Error}}
            <div class="error">{{.Error}}</div>
            {{end}}
            <form method="POST" action="{{template "login_action" .}}">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" name="login" required autofocus autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" name="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
{{end}}
